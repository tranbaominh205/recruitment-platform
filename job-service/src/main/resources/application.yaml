server:
  port: 8084

spring:
  application:
    name: job-service

  datasource:
    url: ${JOB_DBMS_CONNECTION:jdbc:mysql://localhost:3306/job_db}
    username: ${JOB_DBMS_USERNAME:root}
    password: ${JOB_DBMS_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

services:
  employer:
    base-url: ${EMPLOYER_SERVICE_URL:http://localhost:8083}