server:
  port: 8085

spring:
  application:
    name: resume-service

  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${RESUME_MONGO_DATABASE:resume_db}
    username: ${MONGO_ROOT_USERNAME:root}
    password: ${MONGO_ROOT_PASSWORD:root123456}
    authentication-database: admin
    representation:
      uuid: standard

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:root123456}
  bucket: ${MINIO_BUCKET:resumes}