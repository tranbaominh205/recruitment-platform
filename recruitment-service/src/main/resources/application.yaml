server:
  port: 8086

spring:
  application:
    name: recruitment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

  datasource:
    url: ${RECRUITMENT_DBMS_CONNECTION:jdbc:mysql://localhost:3306/recruitment_db}
    username: ${RECRUITMENT_DBMS_USERNAME:root}
    password: ${RECRUITMENT_DBMS_PASSWORD:root123456}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

services:
  candidate:
    base-url: ${CANDIDATE_SERVICE_URL:http://localhost:8082}

  resume:
    base-url: ${RESUME_SERVICE_URL:http://localhost:8085}

  job:
    base-url: ${JOB_SERVICE_URL:http://localhost:8084}

app:
  kafka:
    topics:
      application-status-changed: application.status.changed