server:
  port: 8087

spring:
  application:
    name: matching-service

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-3.5-flash
          temperature: 0.0

  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MATCHING_MONGO_DATABASE:matching_db}
    username: ${MONGO_ROOT_USERNAME:root}
    password: ${MONGO_ROOT_PASSWORD:root123456}
    authentication-database: admin
    representation:
      uuid: standard

services:
  resume:
    base-url: ${RESUME_SERVICE_URL:http://localhost:8085}
  recruitment:
    base-url: ${RECRUITMENT_SERVICE_URL:http://localhost:8086}
  job:
    base-url: ${JOB_SERVICE_URL:http://localhost:8084}
