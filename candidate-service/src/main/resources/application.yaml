server:
  port: 8082

spring:
  application:
    name: candidate-service

  datasource:
    url: ${CANDIDATE_DBMS_CONNECTION:jdbc:mysql://localhost:3306/candidate_db}
    username: ${CANDIDATE_DBMS_USERNAME:root}
    password: ${CANDIDATE_DBMS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC