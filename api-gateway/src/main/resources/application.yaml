server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.tbm.recruitment.gateway: info