server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2

            - id: candidate-service
              uri: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=${app.api-prefix}/candidate/**
              filters:
                - StripPrefix=2
            - id: employer-service
              uri: ${EMPLOYER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=${app.api-prefix}/employer/**
              filters:
                - StripPrefix=2
            - id: job-service
              uri: ${JOB_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=${app.api-prefix}/job/**
              filters:
                - StripPrefix=2
            - id: resume-service
              uri: ${RESUME_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=${app.api-prefix}/resume/**
              filters:
                - StripPrefix=2

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.tbm.recruitment.gateway: info