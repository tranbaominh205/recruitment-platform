server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/identity_db}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root123456}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

security:
  jwt:
    signer-key: ${JWT_SIGNER_KEY}
    access-token-expiration: 3600
    refreshable-duration: 604800

identity:
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha